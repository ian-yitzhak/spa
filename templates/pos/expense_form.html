{% extends "pos/base.html" %}{% block pos_title %}Edit expense{% endblock %}{% block dash %}
<h1 class="text-2xl font-black">Edit expense</h1>
<form method="post" class="mt-6 grid max-w-2xl gap-3 sm:grid-cols-2">{% csrf_token %}
  {% for f in form %}<div class="{% if f.name == 'description' %}sm:col-span-2{% endif %}"><label class="mb-1 block text-sm font-medium">{{ f.label }}</label>{{ f }}{% if f.errors %}<p class="text-xs text-red-600">{{ f.errors.0 }}</p>{% endif %}</div>{% endfor %}
  <div class="flex gap-2 sm:col-span-2"><button class="rounded-lg bg-primary px-5 py-2 text-sm font-semibold text-white">Save</button><a href="{% url 'pos_expenses' %}" class="rounded-lg border px-5 py-2 text-sm">Cancel</a></div>
</form>
{% endblock %}
