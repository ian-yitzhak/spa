{% load icons %}{% for i in items %}
<button hx-post="{% url 'pos_add' i.pk %}" hx-target="#order-panel" hx-swap="innerHTML" class="group flex flex-col overflow-hidden rounded-xl border text-left transition hover:border-primary active:scale-95">
  {% if i.image %}<img src="{{ i.image.url }}" alt="" class="aspect-[4/3] w-full object-cover">{% endif %}
  <div class="flex flex-1 flex-col p-2.5">
    <div class="text-sm font-semibold leading-snug">{{ i.name }}</div>
    <div class="mt-0.5 text-xs text-gray-500">{% if i.category %}{{ i.category.name }} · {% endif %}{{ i.duration_label }}</div>
    <div class="mt-auto pt-1.5 text-sm font-bold text-primary">KES {{ i.shown_price|kes }}{% if i.shown_price != i.list_price %} <span class="text-xs font-normal text-gray-400 line-through">{{ i.list_price|kes }}</span> <span class="rounded bg-green-100 px-1 text-[10px] font-semibold text-green-700">{{ i.discount_label }}</span>{% endif %}</div>
  </div>
</button>
{% empty %}<p class="col-span-full py-8 text-center text-sm text-gray-500">{% if q %}Nothing matches “{{ q }}”.{% elif picked %}{{ picked.name }} has no services attached. <a href="{% url 'pos_staff_edit' picked.pk %}" class="text-primary underline">Attach services</a>{% else %}No services yet. <a href="{% url 'item_new' %}" class="text-primary underline">Add your first service</a>{% endif %}</p>{% endfor %}
{% if page.has_next %}<div class="col-span-full py-2 text-center" id="grid-more"><button hx-get="{% url 'pos_home' %}?{{ qs }}page={{ page.next_page_number }}" hx-target="#grid-more" hx-swap="outerHTML" class="rounded-lg border px-5 py-2 text-sm font-semibold hover:bg-gray-50">Show more ({{ page.end_index }} of {{ page.paginator.count }})</button></div>{% endif %}
