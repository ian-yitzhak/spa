<div class="{{ cls }}"><label class="mb-1 block text-sm font-medium" for="{{ f.id_for_label }}">{{ f.label }}</label>{% if f.field.widget.input_type == 'password' %}<div class="relative">{{ f }}<button type="button" onclick="var i=this.previousElementSibling;i.type=i.type==='password'?'text':'password'" class="absolute inset-y-0 right-0 flex items-center px-3 text-xs text-gray-400 hover:text-dark">show</button></div>{% else %}{{ f }}{% endif %}{% if f.help_text %}<p class="mt-0.5 text-xs text-gray-400">{{ f.help_text }}</p>{% endif %}{% for e in f.errors %}<p class="mt-0.5 text-xs text-red-600">{{ e }}</p>{% endfor %}</div>
