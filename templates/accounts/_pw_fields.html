{% for f in form %}
<div><label class="mb-1 block text-sm font-medium">{{ f.label }}</label>
  {% if f.field.widget.input_type == 'password' %}<div class="relative">{{ f }}<button type="button" onclick="var i=this.previousElementSibling;i.type=i.type===\x27password\x27?\x27text\x27:\x27password\x27" class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-dark" aria-label="Show or hide password"><svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></button></div>{% else %}{{ f }}{% endif %}
  {% if f.errors %}<p class="mt-1 text-xs text-red-600">{{ f.errors.0 }}</p>{% endif %}</div>
{% endfor %}
{% if form.non_field_errors %}<p class="text-xs text-red-600">{{ form.non_field_errors.0 }}</p>{% endif %}
