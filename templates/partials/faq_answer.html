<div class="rounded-lg bg-gray-50 p-3 text-sm">
  {% if q %}<p class="text-xs text-gray-500">{{ q }}</p>{% endif %}
  <p class="mt-1 text-gray-800">{{ answer }}</p>
  {% if suggest_wa and vendor.whatsapp_link %}<a href="{{ vendor.whatsapp_link }}?text={{ q|urlencode }}" target="_blank" rel="noopener" class="mt-2 inline-flex items-center gap-1.5 rounded-lg bg-green-600 px-3 py-1.5 text-xs font-semibold text-white">Ask on WhatsApp</a>{% endif %}
</div>
