<div data-area="{{ r.name|lower }}" class="flex items-center gap-2 rounded-lg border px-3 py-2">
  <label class="flex min-w-0 flex-1 items-center gap-2 text-sm">
    <input type="checkbox" name="areas" value="{{ r.name }}" {% if r.zone %}checked{% endif %} class="h-4 w-4 flex-none rounded border-gray-300 text-primary">
    <span class="truncate">{{ r.name }}</span>
  </label>
  <div class="flex flex-none items-center gap-1 text-sm text-gray-500">KES
    <input name="fee:{{ r.name }}" value="{% if r.zone %}{{ r.zone.fee|floatformat:'0' }}{% endif %}" inputmode="numeric" {% if not r.zone %}disabled{% endif %} class="w-20 rounded-lg border border-gray-300 px-2 py-1 text-sm">
  </div>
</div>
