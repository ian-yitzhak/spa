<div id="pay-box">
  <script src="https://js.paystack.co/v2/inline.js" async></script>
  <h3 class="font-bold">Pay by card or M-Pesa</h3>
  {% if error %}<p class="mt-3 rounded-lg bg-red-500/20 p-3 text-sm text-red-100">{{ error }}</p>{% endif %}
  <form hx-post="{% url 'pay_start' %}" hx-target="#pay-box" hx-swap="outerHTML" hx-indicator="#pay-spin" class="mt-3 grid gap-2 sm:grid-cols-[auto_1fr]">
    {% csrf_token %}<input type="hidden" name="product" value="{{ product|default:'premium' }}">{% if branch %}<input type="hidden" name="branch" value="{{ branch.pk }}">{% endif %}
    <select name="months" class="rounded-lg px-3 py-2.5 text-dark" onchange="var f={% if product == 'pos' %}{{ site.pos_fee|floatformat:'0' }}{% else %}{{ site.premium_fee|floatformat:'0' }}{% endif %};this.form.querySelector('[data-amt]').textContent=(f*this.value).toLocaleString()">
      <option value="1" {% if months == 1 %}selected{% endif %}>1 month</option><option value="3" {% if months == 3 %}selected{% endif %}>3 months</option><option value="6" {% if months == 6 %}selected{% endif %}>6 months</option><option value="12" {% if months == 12 %}selected{% endif %}>12 months</option>
    </select>
    <button class="rounded-lg bg-green-600 px-5 py-2.5 text-sm font-semibold text-white hover:bg-green-700">Pay KES <span data-amt>{% if fee %}{{ fee|floatformat:"-2" }}{% elif product == 'pos' %}{{ site.pos_fee|floatformat:"-2" }}{% else %}{{ site.premium_fee|floatformat:"-2" }}{% endif %}</span> <span id="pay-spin" class="htmx-indicator">…</span></button>
    {% if needs_confirm %}<label class="flex items-center gap-2 text-sm text-gray-200 sm:col-span-2"><input type="checkbox" name="confirm_extend" value="yes" class="h-4 w-4"> I understand this adds more days on top of my current period.</label>{% endif %}
  </form>
  <p class="mt-2 text-xs text-gray-400">A secure Paystack window opens here to pay by card or M-Pesa.</p>
</div>
